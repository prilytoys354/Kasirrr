name: Build APK PRILY TOYS KASIR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Buka file ZIP proyek
        run: |
          mkdir android-project
          unzip -o PRILY_TOYS_KASIR_V43_REVISI_NOTA_LENGKAP.zip -d android-project

      - name: Buat Gradle Wrapper
        working-directory: android-project
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK
        working-directory: android-project
        run: ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: PRILY-TOYS-KASIR-V43-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
