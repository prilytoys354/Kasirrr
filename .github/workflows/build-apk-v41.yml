name: Build PRILY TOYS KASIR V41

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          mkdir source
          unzip -q PRILY_TOYS_KASIR_V41_SOURCE.zip -d source
          ROOT=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          cp -R "$ROOT"/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRILY-TOYS-KASIR-v41-APK
          path: app/build/outputs/apk/debug/app-debug.apk
